name: Build plugins

on:
  push:
    branches: [main]
    paths-ignore:
      - "plugins/*/dist/**"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the commit below can be pushed
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run validate
      - run: npm run typecheck
      - run: npm run build

      - name: Commit built bundles
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins/*/dist
          if git diff --cached --quiet; then
            echo "Bundles unchanged"
          else
            git commit -m "build: refresh plugin bundles [skip ci]"
            git push
          fi
